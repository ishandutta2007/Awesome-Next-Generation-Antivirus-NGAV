<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: url(#titleGradient);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .cyber-grid {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-opacity: 0.4;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }
    @keyframes scanWave {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    @keyframes orbitFloat {
      0% { transform: rotate(0deg) translate(30px) rotate(0deg); }
      100% { transform: rotate(360deg) translate(30px) rotate(-360deg); }
    }
    .pulse-elem {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .scan-line {
      animation: scanWave 5s linear infinite;
    }
    .floating-dot {
      animation: orbitFloat 12s linear infinite;
      transform-origin: 980px 200px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)" />

  <!-- Cyber Grid Background Pattern -->
  <g class="cyber-grid">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Background Ambient Glows -->
  <circle cx="180" cy="80" r="120" fill="#0284c7" opacity="0.15" class="pulse-elem" filter="url(#glow)" />
  <circle cx="1020" cy="200" r="160" fill="#6366f1" opacity="0.18" class="pulse-elem" filter="url(#glow)" />
  <circle cx="600" cy="350" r="100" fill="#a855f7" opacity="0.1" filter="url(#glow)" />

  <!-- Animated Scanning Laser Line in Background -->
  <line x1="60" y1="0" x2="1140" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" class="scan-line" filter="url(#subtleGlow)" />

  <!-- Decorative Shield Graphic (Right Side) -->
  <g transform="translate(980, 200)">
    <!-- Outer Shield Halo -->
    <path d="M0 -90 L65 -50 L65 30 Q65 85 0 115 Q-65 85 -65 30 L-65 -50 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.75" filter="url(#subtleGlow)" />
    <!-- Inner Core Shield -->
    <path d="M0 -70 L50 -38 L50 25 Q50 68 0 92 Q-50 68 -50 25 L-50 -38 Z" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <!-- Security Checkmark / Radar Core -->
    <path d="M-20 -5 L-5 12 L24 -18" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Orbiting Threat Sensor Particle -->
    <circle cx="65" cy="-50" r="4" fill="#38bdf8" class="floating-dot" filter="url(#glow)" />
  </g>

  <!-- Accent Divider Line -->
  <line x1="80" y1="225" x2="860" y2="225" stroke="url(#accentLine)" stroke-width="2" />

  <!-- Foreground Title and Branding -->
  <g transform="translate(80, 0)">
    <!-- Category Tag -->
    <g transform="translate(0, 95)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="16" cy="16" r="5" fill="#10b981" filter="url(#subtleGlow)" />
      <text x="32" y="21" class="badge-text" fill="#38bdf8">NEXT-GEN ANTIVIRUS &amp; EDR</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="180" class="title" filter="url(#subtleGlow)">Awesome NGAV</text>

    <!-- Subtitle -->
    <text x="0" y="265" class="subtitle">Curated Next-Generation Antivirus, EDR Telemetry &amp; Endpoint Defense</text>
    <text x="0" y="295" class="subtitle" font-size="16" fill="#64748b">AI Behavioral Analysis • Kernel &amp; eBPF Telemetry • Open-Source &amp; Enterprise Platforms</text>

    <!-- Interactive Badges / Capability Pills -->
    <g transform="translate(0, 335)">
      <!-- Pill 1 -->
      <g>
        <rect width="145" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="18" class="badge-text" fill="#cbd5e1">🛡️ Behavioral AI</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(155, 0)">
        <rect width="155" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="18" class="badge-text" fill="#cbd5e1">⚡ eBPF &amp; fanotify</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(320, 0)">
        <rect width="160" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="18" class="badge-text" fill="#cbd5e1">🔍 YARA &amp; Forensics</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(490, 0)">
        <rect width="150" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="18" class="badge-text" fill="#cbd5e1">🚀 Enterprise SaaS</text>
      </g>
    </g>
  </g>
</svg>